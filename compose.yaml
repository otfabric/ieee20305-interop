# Reference IEEE 2030.5 servers for local work. Ports are published on
# loopback only: these are test servers with throwaway mTLS certificates that
# must not be reachable from anywhere else.
#
#   make pki                           # throwaway CA, server and device certificates in ./tls
#   docker compose up -d --wait        # every server, waits for readiness
#   docker compose down
#
# Each server provisions the device of tls/client (tls/server/devices). A
# client connects to https://127.0.0.1:<port>/dcap with tls/client/client.crt
# and client.key, and verifies the server with tls/client/ca.crt. The
# GridAPPS-D server accepts only the TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8 cipher
# suite.
#
# IEEE20305_INTEROP_VERSION selects the image tag (default: dev, the local
# build); IEEE20305_EDITION the IEEE 2030.5 version (default 2018).

x-server: &server
  volumes:
    - ./tls:/tls:ro
  healthcheck:
    test: ["CMD", "test", "-f", "/run/ieee20305-interop/ready"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 20s
  stop_grace_period: 15s

name: ieee20305-interop
services:
  gridappsd-server:
    <<: *server
    image: ghcr.io/otfabric/ieee20305-interop-gridappsd:${IEEE20305_INTEROP_VERSION:-dev}
    command: ["server", "--version", "${IEEE20305_EDITION:-2018}", "--tls-dir", "/tls/server"]
    ports:
      - "127.0.0.1:8444:443"
