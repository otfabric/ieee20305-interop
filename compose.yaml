# Reference IEEE 2030.5 servers for local work. Ports are published on
# loopback only: these are test servers with generated mTLS certificates that
# must not be reachable from anywhere else.
#
#   docker compose up -d --wait        # every server, waits for readiness
#   docker compose down
#
# A client connects to https://127.0.0.1:<port>/dcap with the test
# certificates mounted from fixtures.
#
# IEEE20305_INTEROP_VERSION selects the image tag (default: dev, the local
# build).

x-server: &server
  command: ["server"]
  healthcheck:
    test: ["CMD", "test", "-f", "/run/ieee20305-interop/ready"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 20s
  stop_grace_period: 15s

name: ieee20305-interop
services:
  envoy:
    <<: *server
    image: ghcr.io/otfabric/ieee20305-interop-envoy:${IEEE20305_INTEROP_VERSION:-dev}
    ports:
      - "127.0.0.1:8443:443"

  gridappsd-server:
    <<: *server
    image: ghcr.io/otfabric/ieee20305-interop-gridappsd:${IEEE20305_INTEROP_VERSION:-dev}
    ports:
      - "127.0.0.1:8444:443"
