# Machine-readable version manifest for ieee20305-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.3.0"
contract_version: "0.3"        # docs/CONTAINER_CONTRACT.md (draft until 1.0); documents carry schemaVersion "1.0"
fixture_schema: "1.1"          # schemas/fixture.schema.json

protocol:
  name: "IEEE 2030.5"
  versions: ["2018", "2023"]
  profiles: ["CSIP", "CSIP-AUS"]
  default_port: 443            # inside the images; HTTPS with mTLS
  path: "/dcap"

implementations:
  epri:
    priority: P0
    status: implemented
    upstream: "EPRI IEEE 2030.5 Client"
    repository: "https://github.com/epri-dev/IEEE-2030.5-Client"
    version: "v0.2.11"
    revision: "505ee47d9c3ed43ce63087198d09f77338da627d"
    base_images:
      DEBIAN_DIGEST: "sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"   # debian:trixie-slim
    debian_packages:
      GCC_VERSION: "4:14.2.0-1"
      OPENSSL_VERSION: "3.5.7-1~deb13u3"
      PYTHON3_VERSION: "3.13.5-1"
    patches: ["adapters/epri/patches/0001-sha256-padding.patch"]
    license: "BSD-3-Clause"
    language: "C"
    independent_engine: true
    roles: [client]
    versions_claimed: ["2018"]
    tls_cipher_suites: ["TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8"]
    note: >-
      EPRI's C client (client_test, v0.2.11, unmaintained since 2018; schema
      sep.xsd 2.0.4, namespace http://ieee.org/2030.5), built with its own build
      script against OpenSSL 3 after relaxing its OpenSSL 1.1.0 check, with one
      patch: the SHA-256 padding of its LFDI, which crashed for one certificate
      in eight. Runs at OpenSSL security level 0 so that OpenSSL 3 offers CCM_8.
      Its output is free text and it exits 0 whatever happens; the adapter reads
      the documents it prints. register, discover, poll-controls, report
      (client_test's own MirrorUsagePoint, not the fixture's) and respond;
      log-event and put-der send EPRI's own documents, and subscribe is
      commented out upstream, so they are not offered. Known issues:
      tests/known-bugs.tsv.

  envoy:
    priority: P0
    status: implemented
    upstream: "ANU Envoy"
    repository: "https://github.com/bsgip/envoy"
    version: "v2.5.0"
    revision: "9d00340b5592f1fdf09dc74bd743fc251da0bfb5"
    base_images:
      PYTHON_DIGEST: "sha256:57b29a7c050c4e679e4bea572e14b3965cf4b5839de2da49d55e49ffc4024f39"   # python:3.13-slim-trixie
    debian_packages:
      HAPROXY_VERSION: "3.0.11-1+deb13u4"
      POSTGRESQL_VERSION: "17.11-0+deb13u1"
    dependency_lock: "Envoy's uv.lock (exported with hashes); adapters/envoy/build-requirements.txt"
    license: "MIT"
    language: "Python"
    independent_engine: true
    roles: [server]
    versions_claimed: ["2018"]
    profiles_claimed: ["CSIP-AUS"]
    tls_cipher_suites: ["TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8", "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256", "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"]
    note: >-
      ANU/BSGIP Envoy, a Python/FastAPI IEEE 2030.5 server for CSIP-AUS
      (envoy_schema 2.7.0). One image runs PostgreSQL (Envoy's Alembic
      migrations), the Envoy server and admin applications under uvicorn, and
      HAProxy, which terminates mutual TLS and forwards the client certificate's
      SHA-256 fingerprint in x-forwarded-client-cert. Devices are seeded as
      sites through Envoy's CRUD layer. Programs, CSIP-AUS default controls and
      limits, controls and tariffs go through its admin API, for a site group
      that is Envoy's default group. ALLOW_DEVICE_REGISTRATION=true, so an
      unprovisioned device registers itself with a PIN Envoy picks; the adapter
      reports it (device-registered) by listing the sites. No subscriptions
      (aggregator certificates only), no messaging or flow reservations. Known
      issues: tests/known-bugs.tsv.

  py20305:
    priority: P0
    status: implemented
    upstream: "DER Security py20305 / Project Satori"
    repository: "https://github.com/DERSecurity/py20305"
    version: "v0.16.0"
    revision: "79844938eea3d05f5432cdc5f2d07a103e87912b"
    base_images:
      PYTHON_DIGEST: "sha256:57b29a7c050c4e679e4bea572e14b3965cf4b5839de2da49d55e49ffc4024f39"   # python:3.13-slim-trixie
    dependency_lock: "adapters/py20305/requirements.txt"
    license: "Apache-2.0"
    language: "Python"
    independent_engine: true
    roles: [client]
    versions_claimed: ["2018", "2023"]
    tls_cipher_suites: ["TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8"]
    note: >-
      Installed from the pinned source with every dependency from a hashed lock
      (uv pip compile). The adapter drives the py20305 engine: CsipClient
      discovery (programs, default controls, controls, curves, tariffs) and
      registration, Sep2Client for every request, its models for what it sends,
      and its NotificationServer for subscribe. It verifies the server's host
      name. flow-reservation is unsupported (py20305 has no client logic for
      it). Against Envoy, put-der fails because py20305 writes the CSIP-AUS
      extensions in https://csipaus.org/ns rather than /ns/v1.3, and
      poll-pricing because py20305 does not model the RateComponentLink that
      CSIP-AUS 1.3 requires in a TimeTariffInterval; both are in
      tests/known-bugs.tsv. No lock file
      upstream, so the lock is this repository's.

  gridappsd:
    priority: P0
    status: implemented
    upstream: "GridAPPS-D IEEE 2030.5 server and client (PNNL)"
    repository: "https://github.com/GRIDAPPSD/ieee-2030_5-server-go"
    version: "v0.18.0"
    revision: "d7a4a17042af7506610a973c6be8a5466db34053"
    client:
      repository: "https://github.com/GRIDAPPSD/ieee-2030_5-client-go"
      version: "v0.1.0"
      revision: "66570b94ea104b46eb12b48ef2451b3454050176"
    base_images:
      GOLANG_DIGEST: "sha256:aae9c439b447d24c93ee483408992857cf39a3fb6ab7fe53affc65d834891fa8"   # golang:1.26.8-trixie
      DEBIAN_DIGEST: "sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"   # debian:trixie-slim
    license: "LicenseRef-Battelle-BSD"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    versions_claimed: ["2018", "2023"]
    tls_cipher_suites: ["TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8"]
    patches: ["adapters/gridappsd/patches/0001-EndDevice-advertise-the-SubscriptionListLink.patch"]
    note: >-
      The server role runs sep2server with one patch
      (adapters/gridappsd/patches/0001: the EndDevice links its
      SubscriptionListLink), provisions the devices of --tls-dir/devices and
      seeds the fixture's programs, default controls and controls through its
      admin API; its traffic capture gives the device-registered and
      subscription-created events, and call issue-control issues a control
      through the admin API. It delivers notifications with Go's standard TLS,
      trusting the test CA (SSL_CERT_FILE). Curves cannot be seeded and read
      back (boot fixture only, no GET /dc/{id}). The client role is built
      inside the client module and drives its protocol engine
      (internal/inverter); it does not declare subscribe, because its
      notification listener is CCM_8-only and requires a client certificate,
      which sep2server's delivery has neither of. Both roles use the GridAPPS-D
      fork of crypto/tls and offer only the CCM_8 cipher suite.
images:
  epri: "ghcr.io/otfabric/ieee20305-interop-epri"
  envoy: "ghcr.io/otfabric/ieee20305-interop-envoy"
  py20305: "ghcr.io/otfabric/ieee20305-interop-py20305"
  gridappsd: "ghcr.io/otfabric/ieee20305-interop-gridappsd"

platforms: ["linux/amd64", "linux/arm64"]
