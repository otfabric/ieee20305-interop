# Machine-readable version manifest for ieee20305-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles are the source of truth for a build:
# scripts/check-versions.sh fails when this file disagrees with them.

interop_version: "0.1.0"
contract_version: "0.2"        # docs/CONTAINER_CONTRACT.md (draft until 1.0); documents carry schemaVersion "1.0"
fixture_schema: "1.0"          # schemas/fixture.schema.json

protocol:
  name: "IEEE 2030.5"
  versions: ["2018", "2023"]
  profiles: ["CSIP", "CSIP-AUS"]
  default_port: 443            # inside the images; HTTPS with mTLS
  path: "/dcap"

implementations:
  epri:
    priority: P0
    status: planned
    upstream: "EPRI IEEE 2030.5 Client"
    repository: "https://github.com/epri-dev/IEEE-2030.5-Client"
    version: "planned"
    license: "BSD-3-Clause"
    language: "C"
    independent_engine: true
    roles: [client]
    versions_claimed: ["2018"]
    candidate: "commit 505ee47d9c3ed43ce63087198d09f77338da627d (2018-07-27; tags v0.2.11, no releases)"
    note: >-
      EPRI's C client (client_test). Unmaintained since 2018. Builds on
      Debian trixie with OpenSSL 3 using its bash build (build.sh, not
      CMake) after patching the OpenSSL 1.1.0 check in targets.sh. Offers
      only TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8 through OpenSSL; requires
      critical subjectAltName and keyUsage in the server certificate;
      derives the LFDI from the raw certificate file, so it needs DER; takes
      IP literals only; no subscriptions (commented out); free-text output
      and exit status 0 on every error.

  envoy:
    priority: P0
    status: planned
    upstream: "ANU Envoy"
    repository: "https://github.com/bsgip/envoy"
    version: "planned"
    license: "MIT"
    language: "Python"
    independent_engine: true
    roles: [server]
    versions_claimed: ["2018", "2023"]
    profiles_claimed: ["CSIP-AUS"]
    candidate: "v2.5.0, commit 9d00340b5592f1fdf09dc74bd743fc251da0bfb5 (CSIP-AUS v1.3, envoy_schema 2.7.0; uv.lock with hashes)"
    note: >-
      ANU/BSGIP Envoy, a Python/FastAPI IEEE 2030.5 server for CSIP-AUS.
      Needs PostgreSQL (asyncpg, Alembic migrations) and does not terminate
      TLS: a reverse proxy verifies the client certificate and passes it in
      x-forwarded-client-cert. One image therefore bundles PostgreSQL,
      nginx (mutual TLS, which can offer CCM_8 and GCM) and uvicorn.
      ALLOW_DEVICE_REGISTRATION=true admits device certificates; programs
      and controls are seeded as site control groups and site controls.

  py20305:
    priority: P0
    status: implemented
    upstream: "DER Security py20305 / Project Satori"
    repository: "https://github.com/DERSecurity/py20305"
    version: "v0.16.0"
    revision: "79844938eea3d05f5432cdc5f2d07a103e87912b"
    base_images:
      PYTHON_DIGEST: "sha256:57b29a7c050c4e679e4bea572e14b3965cf4b5839de2da49d55e49ffc4024f39"   # python:3.13-slim-trixie
    dependency_lock: "adapters/py20305/requirements.txt"
    license: "Apache-2.0"
    language: "Python"
    independent_engine: true
    roles: [client]
    versions_claimed: ["2018", "2023"]
    tls_cipher_suites: ["TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8"]
    note: >-
      Installed from the pinned source with every dependency from a hashed
      lock (uv pip compile). The adapter drives the py20305 engine:
      CsipClient discovery and registration, and its models for the
      MirrorUsagePoint. It verifies the server's host name. No lock file
      upstream, so the lock is this repository's.

  gridappsd:
    priority: P0
    status: implemented
    upstream: "GridAPPS-D IEEE 2030.5 server and client (PNNL)"
    repository: "https://github.com/GRIDAPPSD/ieee-2030_5-server-go"
    version: "v0.18.0"
    revision: "d7a4a17042af7506610a973c6be8a5466db34053"
    client:
      repository: "https://github.com/GRIDAPPSD/ieee-2030_5-client-go"
      version: "v0.1.0"
      revision: "66570b94ea104b46eb12b48ef2451b3454050176"
    base_images:
      GOLANG_DIGEST: "sha256:aae9c439b447d24c93ee483408992857cf39a3fb6ab7fe53affc65d834891fa8"   # golang:1.26.8-trixie
      DEBIAN_DIGEST: "sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"   # debian:trixie-slim
    license: "LicenseRef-Battelle-BSD"
    language: "Go"
    independent_engine: true
    roles: [server, client]
    versions_claimed: ["2018", "2023"]
    tls_cipher_suites: ["TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8"]
    note: >-
      The server role runs sep2server, provisions the devices of
      --tls-dir/devices and the fixture's program and controls through its
      admin API. The client role is built inside the client module and
      drives its protocol engine (internal/inverter). Both use the
      GridAPPS-D fork of crypto/tls and offer only the CCM_8 cipher suite.

images:
  epri: "ghcr.io/otfabric/ieee20305-interop-epri"
  envoy: "ghcr.io/otfabric/ieee20305-interop-envoy"
  py20305: "ghcr.io/otfabric/ieee20305-interop-py20305"
  gridappsd: "ghcr.io/otfabric/ieee20305-interop-gridappsd"

platforms: ["linux/amd64", "linux/arm64"]
